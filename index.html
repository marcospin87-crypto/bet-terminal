    <script>
      // Anti-loop shield: prevent any external reload script from causing rapid reload loops
      try {
        var lastReload = parseInt(sessionStorage.getItem('midiseq_last_load') || '0', 10);
        var now = Date.now();
        sessionStorage.setItem('midiseq_last_load', now.toString());
      } catch(e) {}

      // Capture early beforeinstallprompt event before React hydrates
      window.__pwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
