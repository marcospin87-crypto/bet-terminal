<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b1120">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Bet Terminal Pro</title>

  <!-- PWA MANIFEST INTEGRATO INLINE -->
  <link rel="manifest" id="pwaManifest">

  <!-- Librerie PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <style>
    :root {
      --bg-body: #0b1120;
      --bg-topbar: #0f172a;
      --bg-panel-left: #090e1a;
      --bg-panel-center: #0f172a;
      --bg-panel-right: #090e1a;
      --bg-card: #131d31;
      --bg-row: #172239;
      --bg-input: #090e1a;
      --border-color: #1e293b;
      --border-input: #334155;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-primary: #38bdf8;
      --modal-bg: #0f172a;
      --row-zebra: rgba(255, 255, 255, 0.04);
    }

    body.light-mode {
      --bg-body: #f8fafc;
      --bg-topbar: #ffffff;
      --bg-panel-left: #f1f5f9;
      --bg-panel-center: #ffffff;
      --bg-panel-right: #f8fafc;
      --bg-card: #ffffff;
      --bg-row: #f1f5f9;
      --bg-input: #ffffff;
      --border-color: #cbd5e1;
      --border-input: #94a3b8;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-primary: #0284c7;
      --modal-bg: #ffffff;
      --row-zebra: rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg-body);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      transition: background 0.15s ease, color 0.15s ease;
    }
    input, button, select { font-family: inherit; }
    input, select { user-select: text; }

    .app-shell { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
    .top-bar {
      height: 48px;
      background: var(--bg-topbar);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      flex-shrink: 0;
    }
    
    .main-grid {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr) 340px;
      flex: 1;
      overflow: hidden;
      transition: grid-template-columns 0.2s ease-in-out;
    }
    .main-grid.right-collapsed {
      grid-template-columns: 240px minmax(0, 1fr) 0px;
    }

    /* COLONNA 1: ROOMS */
    .col-left {
      background: var(--bg-panel-left);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .room-container { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
    .room-card { background: var(--bg-card); border-radius: 8px; padding: 8px; border-left: 5px solid; border-top: 1px solid var(--border-color); border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); }
    .room-header { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .acc-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .btn-acc {
      padding: 8px 4px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.12);
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.05s, filter 0.1s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-acc:active { transform: scale(0.96); filter: brightness(1.2); }

    /* COLONNA 2: FORM COMPILAZIONE */
    .col-center {
      display: flex;
      flex-direction: column;
      background: var(--bg-panel-center);
      border-right: 1px solid var(--border-color);
      overflow: hidden;
      min-width: 0;
    }
    .match-header-inputs {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      align-items: center;
      flex-shrink: 0;
    }
    .editing-banner {
      background: #eab308;
      color: #000;
      font-size: 10px;
      font-weight: 900;
      padding: 4px 6px;
      border-radius: 4px;
      display: none;
      align-items: center;
      white-space: nowrap;
    }
    .dark-input {
      background: var(--bg-input);
      border: 1px solid var(--border-input);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .dark-input:focus { border-color: var(--accent-primary); }
    .table-container { flex: 1; overflow-y: auto; padding: 8px 12px; }
    
    .bet-row {
      display: grid;
      grid-template-columns: minmax(110px, 1.3fr) minmax(140px, 1.4fr) minmax(80px, 0.9fr) minmax(90px, 1fr) 34px;
      align-items: center;
      gap: 6px;
      background: var(--bg-row);
      padding: 6px 8px;
      border-radius: 8px;
      margin-bottom: 6px;
      border-left: 4px solid;
      border-top: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
    }
    .stake-box-container {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .btn-quick-stake {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      font-size: 11px;
      font-weight: 800;
      padding: 5px 6px;
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-quick-stake:active { transform: scale(0.94); filter: brightness(1.2); }
    .num-inp {
      background: var(--bg-input);
      border: 1px solid var(--border-input);
      color: var(--accent-primary);
      font-weight: 800;
      font-size: 14px;
      text-align: center;
      padding: 6px 4px;
      border-radius: 6px;
      width: 100%;
    }
    .num-inp-quote { color: #eab308; }

    .totals-bar {
      background: var(--bg-card);
      border-top: 1px solid var(--border-color);
      padding: 8px 12px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(140px, 190px);
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .total-box { background: var(--bg-input); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border-color); min-width: 0; }
    .total-lbl { font-size: 9px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .total-val { font-size: 15px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .btn-register {
      background: #10b981;
      color: #fff;
      border: none;
      height: 42px;
      border-radius: 6px;
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 0.3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(16, 185, 129, 0.25);
      white-space: nowrap;
    }
    .btn-register.edit-mode {
      background: #eab308;
      color: #0f172a;
      box-shadow: 0 4px 10px rgba(234, 179, 8, 0.25);
    }
    .btn-register:active { transform: scale(0.97); }

    /* COLONNA 3: STORICO CON SESSIONI */
    .col-right {
      background: var(--bg-panel-right);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    .session-control-panel {
      padding: 8px 10px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .right-header {
      padding: 6px 10px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .day-selector-bar {
      padding: 6px 10px;
      background: var(--bg-panel-right);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .today-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
    .today-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .today-card:hover { border-color: var(--accent-primary); }
    .today-card.expanded { border-color: var(--accent-primary); }
    .accounts-breakdown {
      display: none;
      background: var(--bg-input);
      border-radius: 6px;
      padding: 6px;
      margin-top: 4px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .acc-detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      padding: 2px 4px;
      border-bottom: 1px solid var(--row-zebra);
    }
    .acc-detail-row:last-child { border-bottom: none; }

    /* BOTTONI E TOOLBAR */
    .btn-tool {
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border-input);
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .btn-tool:hover { color: var(--text-main); border-color: var(--accent-primary); }
    .btn-del { background: transparent; border: none; color: #ef4444; font-size: 16px; cursor: pointer; padding: 2px 4px; }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: var(--modal-bg);
      border: 1px solid var(--border-input);
      width: 760px;
      max-width: 94vw;
      max-height: 88vh;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }
    .modal-header {
      padding: 12px 16px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
    }
    .modal-body { padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .manage-section { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; }
    .manage-section h4 { font-size: 12px; color: var(--accent-primary); margin-bottom: 8px; text-transform: uppercase; font-weight: 800; }
    
    .acc-tag-editable {
      display: inline-flex;
      align-items: center;
      background: var(--bg-input);
      padding: 3px 6px;
      border-radius: 6px;
      font-size: 11px;
      margin: 3px;
      border: 1px solid var(--border-input);
    }
    .acc-tag-editable input {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-weight: 700;
      font-size: 11px;
      width: 85px;
      outline: none;
    }
    .acc-tag-editable button { background: none; border: none; color: #ef4444; cursor: pointer; font-weight: bold; margin-left: 4px; }

    /* FAST BET TAG SELECTOR */
    .fast-acc-pill {
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: 2px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .fast-acc-pill.selected {
      color: #fff;
      border-color: #38bdf8;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    }
  </style>
</head>
<body>

<div class="app-shell">
  <header class="top-bar">
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="font-size:16px; font-weight:900; color:var(--accent-primary);">⚡ BET TERMINAL</span>
      <span id="backupStatus" style="font-size:10px; color:#10b981; background:rgba(16,185,129,0.1); padding:2px 6px; border-radius:4px; font-weight:700;">● AUTO-SAVE</span>
    </div>
    <div style="display:flex; gap:6px; align-items:center;">
      <button class="btn-tool" onclick="openFastBetModal()" style="background:#eab308; color:#0f172a; font-weight:900; border-color:#ca8a04;">⚡ Fast Bet</button>
      <button id="btnPwaInstall" class="btn-tool" style="display:none; background:#10b981; color:#fff; font-weight:bold; border-color:#059669;">📲 Installa</button>
      <button class="btn-tool" onclick="openConfigModal()" style="background:#2563eb; color:#fff; border-color:#3b82f6;">⚙️ Opzioni & Conti</button>
      <button class="btn-tool" onclick="triggerImportJson()">📥 Carica</button>
      <input type="file" id="importFileInput" accept=".json" style="display:none;" onchange="importDataJson(event)">
      <button class="btn-tool" onclick="exportDataJson()">💾 Backup</button>
      <button class="btn-tool" onclick="exportDataCsv()">📊 CSV</button>
      <button class="btn-tool" id="btnToggleSidebar" onclick="toggleSidebar()" style="background:#334155; color:#fff; font-weight:bold;">◀ Storico</button>
    </div>
  </header>

  <main class="main-grid" id="mainGridContainer">
    <aside class="col-left">
      <div style="padding:8px 12px; background:var(--bg-card); border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:11px; font-weight:800; color:var(--text-muted);">ROOM & CONTI</span>
        <button class="btn-tool" onclick="openConfigModal()" style="font-size:10px; padding:2px 5px;">Modifica</button>
      </div>
      <div class="room-container" id="roomsList"></div>
    </aside>

    <section class="col-center">
      <div
